name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP: "Network Aggregate Connection Keeper (Mantra)"
  VERSION_FILE: Sources/Shared/Model.swift
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: SIGN=- NO_INSTALL=1 ADBLOCK_FETCH=1 ./build.sh
      - name: Self-test (the app must start)
        run: |
          perl -e 'alarm 90; exec @ARGV' "build/$APP.app/Contents/MacOS/Connection Keeper" --selftest
      - name: Bond relay (Go, standard library; linux/arm64 for chromium-vm, darwin for the loopback test)
        run: |
          cd Sources/Bond/server
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../../build/ck-bond-server-linux-arm64 .
          go build -o ../../../build/ck-bond-server-darwin .
      - name: Bond self-test (one stream over 3 emulated lines, one line silenced mid-fetch)
        run: |
          T=$(mktemp -d)
          head -c 67108864 /dev/urandom > "$T/big.bin"
          head -c 2048 /dev/urandom > "$T/small.bin"
          SHA=$(shasum -a 256 "$T/big.bin" | cut -d' ' -f1)
          openssl rand -hex 32 > "$T/token"
          python3 -m http.server 18080 --bind 127.0.0.1 --directory "$T" >/dev/null 2>&1 &
          python3 Tools/ci/udp_echo.py 18053 &
          build/ck-bond-server-darwin -listen 127.0.0.1:18443 -token-file "$T/token" -allow-local -drain 60s 2> "$T/server.log" &
          RELAY=$!
          sleep 2
          ok=0
          CK_BOND_DIRECT="$T/direct.txt" perl -e 'alarm 300; exec @ARGV' "build/$APP.app/Contents/MacOS/ck-aggregate" bond-selftest \
            --server 127.0.0.1:18443 --token-file "$T/token" --url http://127.0.0.1:18080/big.bin --sha "$SHA" --relay-pid "$RELAY" --small /small.bin --udp-echo 127.0.0.1:18053 || ok=$?
          echo "--- relay log"; tail -60 "$T/server.log"
          pkill -f ck-bond-server-darwin || true
          [ $ok -ne 0 ] && exit $ok
          echo "--- ck-aggregate hand-over under load (20 probes/s + a long download)"
          mkdir -p "$T/agg"
          python3 Tools/ci/handover_test.py "build/$APP.app/Contents/MacOS/ck-aggregate" "$T/agg" 18080 "$SHA" || ok=$?
          echo "--- aggregate log"; grep -E "HANDOVER|ck-aggregate v|taken" "$T/agg/aggregate.log" | tail -30
          exit $ok
      - name: Bond idle test (v90; a stream silent longer than the relay's idle limit still echoes)
        run: |
          T=$(mktemp -d)
          head -c 1024 /dev/urandom > "$T/x.bin"; SHA=$(shasum -a 256 "$T/x.bin" | cut -d' ' -f1)
          openssl rand -hex 32 > "$T/token"
          ok=0
          # the relay as deployed (24 h): a stream silent for 15 s must still echo
          build/ck-bond-server-darwin -listen 127.0.0.1:18445 -token-file "$T/token" -allow-local 2> "$T/relay.log" &
          sleep 1
          perl -e 'alarm 90; exec @ARGV' "build/$APP.app/Contents/MacOS/ck-aggregate" bond-selftest \
            --server 127.0.0.1:18445 --token-file "$T/token" --url http://127.0.0.1:18080/x.bin --sha "$SHA" --idle-only 15 --idle-expect kept || ok=1
          echo "--- relay log"; grep -E "idle stream|ends" "$T/relay.log" | head -3
          pkill -f ck-bond-server-darwin || true; sleep 1
          # the control: the old rule shrunk to 4 s must end the same stream (the test sees a reset when there is one)
          CK_BOND_IDLE=4s build/ck-bond-server-darwin -listen 127.0.0.1:18446 -token-file "$T/token" -allow-local 2> "$T/relay2.log" &
          sleep 1
          perl -e 'alarm 90; exec @ARGV' "build/$APP.app/Contents/MacOS/ck-aggregate" bond-selftest \
            --server 127.0.0.1:18446 --token-file "$T/token" --url http://127.0.0.1:18080/x.bin --sha "$SHA" --idle-only 10 --idle-expect ended || ok=1
          pkill -f ck-bond-server-darwin || true
          exit $ok
      - name: Keeper ladder test (v90; no Wi-Fi power cycle while a second line carries or on a phone hotspot)
        run: ./Tools/ci/keeper_test.sh "build/$APP.app/Contents/MacOS/connection-keeperd"
      - name: Same-line rule (v90; a phone and its own hotspot are one line)
        run: perl -e 'alarm 30; exec @ARGV' "build/$APP.app/Contents/MacOS/ck-aggregate" sameline-selftest
      - name: Way test (FRANKFURT → CROATIA → FRANKFURT under load; request 88)
        run: |
          T=$(mktemp -d); mkdir -p "$T/st"
          sudo ifconfig lo0 alias 127.0.0.2 up
          openssl rand -hex 32 > "$T/token"
          build/ck-bond-server-darwin -listen 127.0.0.1:18444 -token-file "$T/token" -allow-local -dial-from 127.0.0.2 2> "$T/relay.log" &
          sleep 1
          ok=0
          python3 Tools/ci/way_test.py "build/$APP.app/Contents/MacOS/ck-aggregate" "$T/st" 18444 "$T/token" || ok=$?
          grep -E "BOND (on|off|draining|in use|stepped)" "$T/st/way-aggregate.log" | tail -8
          pkill -f ck-bond-server-darwin || true
          exit $ok
      - name: Session test (open = through the aggregation, quit and crash = the Mac as before; 10 probes/s)
        run: ./Tools/ci/session_test.sh
      - name: Window snapshot (the selftest's picture of the stripe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-window
          path: build/selftest-window.png
          if-no-files-found: ignore
      - name: Pack
        run: cd build && cp "$(ls *-connection-keeper-v*.zip | head -1)" app.zip
      - name: Release (Latest)
        if: github.ref == 'refs/heads/main'      # v90: a run started by hand on another ref checks, never releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^let CKVersion = \([0-9]*\)/\1/p' "$VERSION_FILE")
          if gh release view "v$V" >/dev/null 2>&1; then gh release upload "v$V" build/app.zip build/ck-bond-server-linux-arm64 --clobber
          else gh release create "v$V" build/app.zip build/ck-bond-server-linux-arm64 --target "$GITHUB_SHA" --latest --title "$APP v$V" --notes "$(git log -1 --format=%s)"; fi
