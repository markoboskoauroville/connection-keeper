name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP: "Network Aggregate Connection Keeper (Mantra)"
  VERSION_FILE: Sources/Shared/Model.swift
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: SIGN=- NO_INSTALL=1 ADBLOCK_FETCH=1 ./build.sh
      - name: Self-test (the app must start)
        run: |
          perl -e 'alarm 90; exec @ARGV' "build/$APP.app/Contents/MacOS/Connection Keeper" --selftest
      - name: Bond relay (Go, standard library; linux/arm64 for chromium-vm, darwin for the loopback test)
        run: |
          cd Sources/Bond/server
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../../build/ck-bond-server-linux-arm64 .
          go build -o ../../../build/ck-bond-server-darwin .
      - name: Bond self-test (one stream over 3 emulated lines, one line silenced mid-fetch)
        run: |
          T=$(mktemp -d)
          head -c 67108864 /dev/urandom > "$T/big.bin"
          head -c 2048 /dev/urandom > "$T/small.bin"
          SHA=$(shasum -a 256 "$T/big.bin" | cut -d' ' -f1)
          openssl rand -hex 32 > "$T/token"
          python3 -m http.server 18080 --bind 127.0.0.1 --directory "$T" >/dev/null 2>&1 &
          build/ck-bond-server-darwin -listen 127.0.0.1:18443 -token-file "$T/token" -allow-local -drain 60s 2> "$T/server.log" &
          RELAY=$!
          sleep 2
          ok=0
          perl -e 'alarm 300; exec @ARGV' "build/$APP.app/Contents/MacOS/ck-aggregate" bond-selftest \
            --server 127.0.0.1:18443 --token-file "$T/token" --url http://127.0.0.1:18080/big.bin --sha "$SHA" --relay-pid "$RELAY" --small /small.bin || ok=$?
          echo "--- relay log"; tail -60 "$T/server.log"
          pkill -f ck-bond-server-darwin || true
          [ $ok -ne 0 ] && exit $ok
          echo "--- ck-aggregate hand-over under load (20 probes/s + a long download)"
          mkdir -p "$T/agg"
          python3 Tools/ci/handover_test.py "build/$APP.app/Contents/MacOS/ck-aggregate" "$T/agg" 18080 "$SHA" || ok=$?
          echo "--- aggregate log"; grep -E "HANDOVER|ck-aggregate v|taken" "$T/agg/aggregate.log" | tail -30
          exit $ok
      - name: Pack
        run: cd build && cp "$(ls *-connection-keeper-v*.zip | head -1)" app.zip
      - name: Release (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^let CKVersion = \([0-9]*\)/\1/p' "$VERSION_FILE")
          if gh release view "v$V" >/dev/null 2>&1; then gh release upload "v$V" build/app.zip build/ck-bond-server-linux-arm64 --clobber
          else gh release create "v$V" build/app.zip build/ck-bond-server-linux-arm64 --target "$GITHUB_SHA" --latest --title "$APP v$V" --notes "$(git log -1 --format=%s)"; fi
